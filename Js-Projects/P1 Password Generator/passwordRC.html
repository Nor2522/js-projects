<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pasword greneraator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: c1c1c1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #container {
        background-color: #001;
        color: #fff;
        width: 35rem;
        height: 20rem;
        border-radius: 8px;
        text-align: center;
        padding: 80px 0px;
      }
      h1 {
        text-transform: capitalize;
        margin-bottom: 30px;
      }
      #password {
        width: 300px;
        height: 35px;
        background-color: #c1c1;
        border-bottom: solid 1px rgb(242, 245, 242);
        outline: none;
        color: #fff;
        font-size: 1rem;
        padding-left: 5px;
      }
      #copy {
        background-color: rgb(53, 117, 5);
        color: #fff;
        width: 50px;
        height: 35px;
        border: none;
      }
      #generate {
        display: block;
        margin: 30px auto;
        width: 6rem;
        height: 45px;
        background-color: blue;
        border: none;
        border-radius: 8px;
        color: #fff;
        text-transform: capitalize;
        font-size: 1rem;
      }
      #copy:hover {
        background-color: rgb(8, 237, 107);
      }
    </style>
  </head>
  <body>
    <main id="container">
      <h1>password generator</h1>
      <input type="text" id="password" placeholder="your password" />
      <button id="copy">copy</button>
      <button id="generate">generate</button>
    </main>
    <script>
      // the dom
      const passwordEl = document.getElementById("password");
      const copyBtn = document.getElementById("copy");
      const generateBtn = document.getElementById("generate");

      generateBtn.addEventListener("click", () => {
        randomPassword();
      });

      //   copy

      copyBtn.addEventListener("click", () => {
        const inputValue = passwordEl.value;
        console.log(inputValue);
        navigator.clipboard.writeText(inputValue);
      });

      function randomPassword() {
        const char =
          "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%&?._";

        let password = "";
        for (let i = 0; i < 10; i++) {
          const randomChar = Math.floor(Math.random() * char.length);

          password += char[randomChar];
        }
        return (passwordEl.value = password);
      }
    </script>
  </body>
</html>
